<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>코드 취약점 분석기</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="public/style.css" />
  </head>
  <body class="p-4">
    <h1 class="text-3xl font-bold mb-4">코드 취약점 분석기</h1>
    <form id="code-form">
      <textarea
        id="code-input"
        name="code"
        rows="12"
        cols="80"
        placeholder="분석할 코드를 여기에 입력하세요..."
        class="border border-gray-300 rounded p-2 w-full mb-4 resize-none"
      ></textarea>
      <br />
      <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded">분석 시작</button>
    </form>
    <h2 class="text-2xl font-bold mt-4 mb-2">분석 결과</h2>
    <div
      id="result"
      class="markdown-body border border-gray-300 rounded p-4 w-full h-96 overflow-y-auto bg-white"
    >
      <!-- 결과 출력될 곳 -->
    </div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <script src="public/script.js"></script>
  </body>
</html>
