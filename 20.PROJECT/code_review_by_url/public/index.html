<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub 코드 취약점 분석기</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <div class="container mx-auto p-4">
      <h1 class="text-2xl font-bold mb-4">GitHub 코드 취약점 분석기</h1>
      <form
        id="code-form"
        class="mb-6 rounded-2xl border border-slate-200 bg-gradient-to-br from-slate-50 to-white p-4 shadow-sm"
      >
        <div class="mb-3">
          <label for="code-url" class="mb-2 block text-sm font-semibold text-slate-800"
            >GitHub 파일 URL</label
          >
          <input
            type="text"
            id="code-url"
            placeholder="https://github.com/..."
            class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-sm outline-none ring-0 transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100"
          />
        </div>

        <fieldset class="mb-4">
          <legend class="mb-2 text-sm font-semibold text-slate-800">취약점 유형 선택</legend>
          <div class="flex flex-wrap gap-2">
            <label
              class="inline-flex cursor-pointer items-center gap-2 rounded-full border border-slate-300 bg-white px-3 py-1.5 text-sm text-slate-700"
            >
              <input
                type="checkbox"
                name="vuln_types"
                value="민감정보(하드코딩된 암호)"
                class="h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500"
              />
              민감정보(하드코딩된 암호)
            </label>

            <label
              class="inline-flex cursor-pointer items-center gap-2 rounded-full border border-slate-300 bg-white px-3 py-1.5 text-sm text-slate-700"
            >
              <input
                type="checkbox"
                name="vuln_types"
                value="SQL Injection"
                class="h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500"
              />
              SQL Injection
            </label>

            <label
              class="inline-flex cursor-pointer items-center gap-2 rounded-full border border-slate-300 bg-white px-3 py-1.5 text-sm text-slate-700"
            >
              <input
                type="checkbox"
                name="vuln_types"
                value="XSS"
                class="h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500"
              />
              XSS
            </label>
          </div>
        </fieldset>

        <button
          type="submit"
          class="w-full rounded-xl bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-blue-700 active:scale-[0.99] sm:w-auto"
        >
          분석 시작
        </button>
      </form>
      <div class="mb-4">
        <h2 class="text-xl font-semibold mb-2">소스 코드</h2>
        <pre
          id="source-code"
          class="bg-gray-100 p-4 rounded overflow-y-auto whitespace-pre-wrap h-64 text-sm font-mono text-gray-800"
        ></pre>
      </div>
      <div class="mb-4">
        <h2 class="text-xl font-semibold mb-2">분석 결과</h2>
        <div id="result" class="mt-4"></div>
      </div>
    </div>
    <script src="public/script.js"></script>
  </body>
</html>
