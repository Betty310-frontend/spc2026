<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>12. Table</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <table class="min-w-full divide-x-2 divide-y-2 divide-gray-200">
      <thead class="ltr:text-left rtl:text-right">
        <tr class="*:font-medium *:text-gray-900">
          <td class="border border-gray-200 px-3 py-2 whitespace-nowrap">
            셀 1
          </td>
          <td class="border border-gray-200 px-3 py-2 whitespace-nowrap">
            셀 2
          </td>
          <td class="border border-gray-200 px-3 py-2 whitespace-nowrap">
            셀 3
          </td>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-200">
        <tr class="*:text-gray-900 *:first:font-medium">
          <td class="border border-gray-200 px-3 py-2 whitespace-nowrap">
            셀 4
          </td>
          <td class="border border-gray-200 px-3 py-2 whitespace-nowrap">
            셀 5
          </td>
          <td class="border border-gray-200 px-3 py-2 whitespace-nowrap">
            셀 6
          </td>
        </tr>
        <tr class="*:text-gray-900 *:first:font-medium">
          <td class="border border-gray-200 px-3 py-2 whitespace-nowrap">
            셀 7
          </td>
          <td class="border border-gray-200 px-3 py-2 whitespace-nowrap">
            셀 8
          </td>
          <td class="border border-gray-200 px-3 py-2 whitespace-nowrap">
            셀 9
          </td>
        </tr>
        <tr class="*:text-gray-900 *:first:font-medium">
          <td class="border border-gray-200 px-3 py-2 whitespace-nowrap">
            셀 10
          </td>
          <td class="border border-gray-200 px-3 py-2 whitespace-nowrap">
            셀 11
          </td>
          <td class="border border-gray-200 px-3 py-2 whitespace-nowrap">
            셀 12
          </td>
        </tr>
      </tbody>
    </table>

    <div class="inline-flex my-4">
      <button
        type="button"
        class="rounded-s-sm border border-gray-200 px-3 py-2 font-medium text-gray-700 transition-colors hover:bg-gray-50 hover:text-gray-900 focus:z-10 focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-white focus:outline-none disabled:pointer-events-auto disabled:opacity-50"
        onclick="changeOddCellsColor()"
      >
        홀수 셀 색상 변경
      </button>
      <button
        type="button"
        class="-ms-px rounded-e-sm border border-gray-200 px-3 py-2 font-medium text-gray-700 transition-colors hover:bg-gray-50 hover:text-gray-900 focus:z-10 focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-white focus:outline-none disabled:pointer-events-auto disabled:opacity-50"
        onclick="changeEvenCellsColor()"
      >
        짝수 셀 색상 변경
      </button>
    </div>

    <script>
      const tdElemList = [...document.getElementsByTagName("td")];

      function changeOddCellsColor() {
        tdElemList.forEach((tdElem, idx) => {
          if (idx % 2 === 0) {
            tdElem.style.backgroundColor = "rgba(0,0,0,0.3)";
          } else {
            tdElem.style.backgroundColor = "";
          }
        });
      }

      function changeEvenCellsColor() {
        tdElemList.forEach((tdElem, idx) => {
          if (idx % 2 === 1) {
            tdElem.style.backgroundColor = "rgba(0,0,0,0.3)";
          } else {
            tdElem.style.backgroundColor = "";
          }
        });
      }
    </script>
  </body>
</html>
