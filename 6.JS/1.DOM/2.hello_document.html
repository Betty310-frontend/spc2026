<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2. Hello Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <script>
      function heyHello() {
        document.write("<h1 class='text-3xl font-bold'>Hey Hello!!!</h1>");
        document.write("<p>");
        document.write("HELLO, AGAIN!!!");
        document.write("</p>");

        for (let i = 1; i <= 5; i++) {
          document.write(`숫자: ${i} <br/>`);
        }
      }

      heyHello();
    </script>
  </body>
</html>
