<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>5. Hello Dom 2</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <h1 class="text-3xl font-bold my-2">나의 헤딩</h1>
    <p class="text">여기는 나의 문장이 있는 곳</p>
    <div id="output" class="my-2">
      <!-- 여기가 동적으로 컨텐츠를 채울 곳 -->
    </div>
    <p class="my-2 text">여기는 나의 두번째 문장이 있는 곳</p>
    <button
      class="rounded-sm border border-indigo-600 bg-indigo-600 px-12 py-3 text-sm font-medium text-white hover:bg-transparent hover:text-indigo-600"
      onclick="sayHello4()"
    >
      여기는 나의 버튼
    </button>
    <script>
      function sayHello() {
        const myOutput = document.getElementById("output");
        console.log(myOutput);
        myOutput.textContent = "나의 새로운 동적 문장";
      }

      function sayHello2() {
        // getElements 복수형
        // 복수형은 리스트가 반환 됨 (HTMLCollection)
        // 리스트의 멤버는 인덱스로 가져옴
        const myOutput = document.getElementsByTagName("div");
        console.log(myOutput[0]);
        myOutput[0].textContent = "나의 새로운 동적 문장2";
      }

      function sayHello3() {
        const myOutput = document.getElementsByTagName("p");

        console.log(myOutput[0]); // 첫번째 p태그
        console.log(myOutput[1]); // 두번째 p태그

        myOutput[1].textContent = "나의 새로운 동적 문장2";
      }
      function sayHello2() {
        // getElements 복수형
        // 복수형은 리스트가 반환 됨 (HTMLCollection)
        // 리스트의 멤버는 인덱스로 가져옴
        const myOutput = document.getElementsByTagName("div");
        console.log(myOutput[0]);
        myOutput[0].textContent = "나의 새로운 동적 문장2";
      }

      function sayHello4() {
        const myOutput = document.getElementsByClassName("text");

        console.log(myOutput);
        console.log(myOutput[0]); // 첫번째 p태그
        console.log(myOutput[1]); // 두번째 p태그

        myOutput[1].textContent = "나의 새로운 동적 문장2";
      }
    </script>
  </body>
</html>
