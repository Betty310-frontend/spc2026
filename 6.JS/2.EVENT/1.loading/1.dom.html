<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1. DOM</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // HTML에 대한 DOM 로딩이 완료된 시점 (CSS, 이미지 등은 아직 로드되지 않을 수 있음)
        console.log("DOM이 완전히 로드되고 분석되었습니다.");
      });
    </script>
  </body>
</html>
