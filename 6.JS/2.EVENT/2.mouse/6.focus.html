<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>6. Focus</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <input
      type="text"
      id="my-id"
      class="border p-2"
      placeholder="여기에 아이디를 입력하세요."
    />
    <input
      type="password"
      id="my-password"
      class="border p-2"
      placeholder="여기에 비밀번호를 입력하세요."
    />
    <script>
      const myIdInput = document.getElementById("my-id");
      const myPasswordInput = document.getElementById("my-password");

      myIdInput.addEventListener("focus", () => {
        console.log("아이디 입력창에 포커스가 생겼습니다.");
      });

      myIdInput.addEventListener("blur", () => {
        console.log("아이디 입력창에서 포커스가 사라졌습니다.");
      });

      myPasswordInput.addEventListener("focus", () => {
        console.log("비밀번호 입력창에 포커스가 생겼습니다.");
      });

      myPasswordInput.addEventListener("blur", () => {
        console.log("비밀번호 입력창에서 포커스가 사라졌습니다.");
      });
    </script>
  </body>
</html>
