<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>8. Drag File</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
      #drop-zone {
        width: 300px;
        height: 200px;
        border: 2px dashed #cccccc;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <div id="drop-zone">여기에 파일을 드래그하세요.</div>
    <div id="file-list">
      <h3 class="text-xl font-bold my-3">드롭된 파일 목록</h3>
      <div class="flow-root">
        <dl
          id="file-name-list"
          class="-my-3 divide-y divide-gray-200 rounded border border-gray-200 text-sm *:even:bg-gray-50"
        ></dl>
      </div>
    </div>
    <script>
      const dropZone = document.getElementById("drop-zone");
      const fileNameList = document.getElementById("file-name-list");

      dropZone.addEventListener("dragover", (ev) => {
        ev.preventDefault();
        dropZone.classList.add("bg-gray-100");
      });

      dropZone.addEventListener("dragleave", (ev) => {
        ev.preventDefault();
        dropZone.classList.remove("bg-gray-100");
      });

      dropZone.addEventListener("drop", (ev) => {
        ev.preventDefault();
        dropZone.classList.remove("bg-gray-100");

        const files = ev.dataTransfer.files;
        const fileItemCount = fileNameList.querySelectorAll("div").length;

        for (let i = 0; i < files.length; i++) {
          const listItem = document.createElement("div");
          listItem.className =
            "grid grid-cols-1 gap-1 p-3 sm:grid-cols-3 sm:gap-4";
          const dt = document.createElement("dt");
          dt.className = "font-medium text-gray-900";
          dt.textContent = `파일 ${fileItemCount + i + 1}`;
          const dd = document.createElement("dd");
          dd.className = "text-gray-700 sm:col-span-2";
          dd.textContent = files[i].name;
          listItem.appendChild(dt);
          listItem.appendChild(dd);
          fileNameList.appendChild(listItem);
        }
      });
    </script>
  </body>
</html>
