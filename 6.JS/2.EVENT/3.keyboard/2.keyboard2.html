<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2. Keyboard 2</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <input
      type="text"
      id="my-input"
      class="border border-1 p-2"
      placeholder="키를 입력하시오."
    />
    <div id="display-key" class="text-3xl text-center mt-4 text-gray-500">
      <!-- 키 입력 상태를 표시할 영역 -->
    </div>
    <script>
      const input = document.getElementById("my-input");
      const displayKey = document.getElementById("display-key");

      input.addEventListener("keydown", (event) => {
        console.log(event);
        console.log(`키 입력: ${event.key.trim() ? event.key : event.code}`);
        displayKey.innerHTML += `키 입력: ${event.key.trim() ? event.key : event.code}<br/>`;
      });
    </script>
  </body>
</html>
