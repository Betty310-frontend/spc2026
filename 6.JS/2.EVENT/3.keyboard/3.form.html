<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3. Form</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <form action="/submit" id="my-form" method="get">
      <textarea
        name="my-textarea"
        id="my-textarea"
        rows="10"
        cols="30"
        class="border border-1 p-2 w-full"
        placeholder="텍스트를 입력하시오."
      ></textarea>
      <br />
      <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded">
        Submit
      </button>
    </form>
    <script>
      const myTextarea = document.getElementById("my-textarea");
      myTextarea.addEventListener("keydown", (event) => {
        if (event.shiftKey && event.key === "Enter") {
          event.preventDefault(); // 기본 동작인 줄바꿈 방지
          document.getElementById("my-form").submit();
        }
      });
    </script>
  </body>
</html>
