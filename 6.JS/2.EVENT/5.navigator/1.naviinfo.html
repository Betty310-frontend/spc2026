<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1. Navi Info</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <h1 class="text-3xl font-bold my-4">
      당신의 브라우저 정보는 다음과 같습니다.
    </h1>

    <script>
      const { userAgent, platform, language, onLine } = navigator;
      document.write(`
      <div class="text-xl">
            <p><strong class="my-2">User Agent</strong><br/>${userAgent}</p>
            <p><strong class="my-2">Platform</strong><br/>${platform}</p>
            <p><strong class="my-2">Language</strong><br/>${language}</p>
            <p><strong class="my-2">Online Status</strong><br/>${onLine ? "Online" : "Offline"}</p>
        </div>
        `);
    </script>
  </body>
</html>
