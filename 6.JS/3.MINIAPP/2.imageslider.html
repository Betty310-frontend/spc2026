<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2. Image Slider</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <h1 class="text-3xl font-bold text-center">2. Image Slider</h1>
    <div
      id="img-container"
      class="slider w-full max-w-sm flex flex-col items-center justify-center mt-4 mx-auto"
    >
      <article
        class="overflow-hidden rounded-lg shadow-sm transition hover:shadow-lg"
      >
        <img
          class="inline-block w-full min-h-[400px] object-cover"
          src="images/capybara1.png"
          alt="Capybara 1"
        />

        <div class="bg-white p-4 sm:p-6">
          <a href="#">
            <h3 class="filename mt-0.5 text-lg text-gray-900"></h3>
          </a>
        </div>
      </article>

      <article
        class="hidden overflow-hidden rounded-lg shadow-sm transition hover:shadow-lg"
      >
        <img
          class="inline-block w-full min-h-[400px] object-cover"
          src="images/capybara2.jpg"
          alt="Capybara 2"
        />

        <div class="bg-white p-4 sm:p-6">
          <a href="#">
            <h3 class="filename mt-0.5 text-lg text-gray-900"></h3>
          </a>
        </div>
      </article>

      <article
        class="hidden overflow-hidden rounded-lg shadow-sm transition hover:shadow-lg"
      >
        <img
          class="inline-block w-full min-h-[400px] object-cover"
          src="images/capybara3.jpg"
          alt="Capybara 3"
        />

        <div class="bg-white p-4 sm:p-6">
          <a href="#">
            <h3 class="filename mt-0.5 text-lg text-gray-900"></h3>
          </a>
        </div>
      </article>
      <!-- <img class="h-[300px]" src="images/capybara1.png" alt="Capybara 1" /> -->
      <!-- <img
        class="hidden h-[300px]"
        src="images/capybara2.jpg"
        alt="Capybara 2"
      /> -->
      <!-- <img
        class="hidden h-[300px]"
        src="images/capybara3.jpg"
        alt="Capybara 3"
      /> -->

      <!-- <div id="filename" class="finename"></div> -->
      <div class="buttons flex gap-2 mt-4 w-full max-w-3xs">
        <button
          id="prev-btn"
          class="bg-blue-500 text-white px-4 py-2 rounded cursor-pointer flex-1 hover:bg-blue-600 disabled:bg-gray-400 disabled:cursor-not-allowed"
        >
          Previous
        </button>
        <button
          id="next-btn"
          class="bg-blue-500 text-white px-4 py-2 rounded cursor-pointer flex-1 hover:bg-blue-600 disabled:bg-gray-400 disabled:cursor-not-allowed"
        >
          Next
        </button>
      </div>
    </div>
    <script>
      const articles = document.querySelectorAll("#img-container article");
      const filenameDisplay = document.getElementsByClassName("filename");
      const prevBtn = document.getElementById("prev-btn");
      const nextBtn = document.getElementById("next-btn");

      let currentIdx = 0;

      function showImage(currentIdx) {
        if (currentIdx === 0) {
          prevBtn.disabled = true;
        } else {
          prevBtn.disabled = false;
        }

        if (currentIdx === articles.length - 1) {
          nextBtn.disabled = true;
        } else {
          nextBtn.disabled = false;
        }

        articles.forEach((article, i) => {
          article.classList.toggle("hidden", i !== currentIdx);
        });
        const filename = articles[currentIdx]
          .querySelector("img")
          .src.split("/")
          .pop();
        filenameDisplay[currentIdx].textContent = filename;
      }

      //   NOTE: 무한 슬라이드 버전
      //   prevBtn.addEventListener("click", () => {
      //     currentIdx = (currentIdx - 1 + images.length) % images.length;
      //     showImage(currentIdx);
      //   });

      //   nextBtn.addEventListener("click", () => {
      //     currentIdx = (currentIdx + 1) % images.length;
      //     showImage(currentIdx);
      //   });

      // NOTE: 슬라이드 양 끝에서 disabled 버전
      prevBtn.addEventListener("click", () => {
        if (currentIdx > 0) {
          currentIdx--;
          showImage(currentIdx);
        }
      });

      nextBtn.addEventListener("click", () => {
        if (currentIdx < articles.length - 1) {
          currentIdx++;
          showImage(currentIdx);
        }
      });

      // NOTE: 초기 이미지 표시
      showImage(currentIdx);
    </script>
  </body>
</html>
