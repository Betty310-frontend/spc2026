<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>4. Search Filter</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <h1 class="text-3xl font-bold text-center my-4">4. 실시간 검색 필터</h1>
    <input
      type="text"
      id="search-input"
      placeholder="검색어..."
      class="border border-gray-300 rounded-md p-2 w-full max-w-md mx-auto block mt-4"
    />

    <div class="flow-root">
      <dl
        id="keyword-container"
        class="w-full max-w-md max-h-96 mx-auto my-3 divide-y divide-gray-200 rounded border border-gray-200 text-sm overflow-y-auto *:even:bg-gray-50"
      ></dl>
    </div>

    <script>
      const fruits = [
        "Apple",
        "Banana",
        "Orange",
        "Grape",
        "Strawberry",
        "Blueberry",
        "Mango",
        "Pineapple",
        "Watermelon",
        "Peach",
        "Pear",
        "Cherry",
        "Kiwi",
        "Lemon",
        "Lime",
        "Plum",
        "Apricot",
        "Coconut",
        "Papaya",
        "Melon",
      ];

      const searchInput = document.getElementById("search-input");
      const keywordContainer = document.getElementById("keyword-container");

      function createKeywordList(items) {
        keywordContainer.innerHTML = "";
        items.forEach((item) => {
          const elem = document.createElement("div");
          elem.className = "grid grid-cols-1 gap-1 p-3 sm:grid-cols-3 sm:gap-4";
          const dt = document.createElement("dt");
          dt.className = "font-medium text-gray-900";
          dt.textContent = item;
          elem.appendChild(dt);
          keywordContainer.appendChild(elem);
        });
      }

      let debounceTimer;
      searchInput.addEventListener("input", (event) => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
          const query = event.target.value.toLowerCase();
          const filteredFruits = fruits.filter((fruit) =>
            fruit.toLowerCase().includes(query),
          );
          createKeywordList(filteredFruits);
        }, 300);
      });

      // 초기 전체 목록 표시
      createKeywordList(fruits);
    </script>
  </body>
</html>
