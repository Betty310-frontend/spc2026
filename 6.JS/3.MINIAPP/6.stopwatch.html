<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>6. Stop Watch</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <!-- 00:00.00 -->
    <!-- Start, Stop, Reset -->

    <div
      class="w-full h-screen flex flex-col justify-center items-center bg-radial from-slate-700 from-40% to-slate-950"
    >
      <h1 class="text-5xl font-bold mb-8 text-gray-100">Stopwatch</h1>

      <div
        class="container rounded-lg shadow-lg border border-gray-200 w-full max-w-2xl text-center bg-white py-10 overflow-visible"
      >
        <div
          id="timer"
          class="flex justify-center items-center text-8xl font-bold p-3 rounded-lg bg-black text-white shadow-md w-[110%] ml-[-5%]"
        >
          00:00.00
        </div>

        <div class="flex gap-2 my-4 justify-center">
          <button
            id="stop-btn"
            class="-ms-px border border-gray-200 px-3 py-2 font-medium text-gray-700 transition-colors hover:bg-gray-50 hover:text-gray-900 focus:z-10 focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-white focus:outline-none disabled:cursor-not-allowed disabled:opacity-50"
          >
            Pause
          </button>

          <button
            id="start-btn"
            class="rounded-s-sm border border-black-500 bg-black px-3 py-2 font-medium text-white transition-colors hover:opacity-75 focus:z-10 focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-white focus:outline-none disabled:cursor-not-allowed disabled:opacity-50"
          >
            Start
          </button>

          <button
            id="reset-btn"
            class="-ms-px rounded-e-sm border border-gray-200 px-3 py-2 font-medium text-gray-700 transition-colors hover:bg-gray-50 hover:text-gray-900 focus:z-10 focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-white focus:outline-none disabled:cursor-not-allowed disabled:opacity-50"
          >
            Reset
          </button>
        </div>
      </div>
    </div>
    <script>
      /**
       * 1. Start 버튼에 이벤트를 추가해서 00:00.00 형태로 setInterval(10ms)로 시간 업데이트
       * 2. Stop 버튼에 이벤트를 추가해서 setInterval 멈추기
       * 3. Reset 버튼에 이벤트를 추가해서 시간을 초기화하기
       */
      const timer = document.getElementById("timer");
      const startBtn = document.getElementById("start-btn");
      const stopBtn = document.getElementById("stop-btn");
      const resetBtn = document.getElementById("reset-btn");

      let timeId = null;
      let currentTime = 0;

      function initialize() {
        timer.textContent = "00:00.00";
        startBtn.disabled = false;
        stopBtn.disabled = true;
        resetBtn.disabled = true;
      }

      function updateTimer() {
        const minutes = String(Math.floor(currentTime / 60000)).padStart(
          2,
          "0",
        );
        const seconds = String(
          Math.floor((currentTime % 60000) / 1000),
        ).padStart(2, "0");
        const milliseconds = String(currentTime % 1000)
          .padStart(2, "0")
          .slice(0, 2);
        timer.textContent = `${minutes}:${seconds}.${milliseconds}`;
      }

      startBtn.addEventListener("click", () => {
        startBtn.disabled = true;
        stopBtn.disabled = false;
        resetBtn.disabled = false;

        if (timeId) return;
        timeId = setInterval(() => {
          currentTime += 10;
          updateTimer();
        }, 10);

        stopBtn.addEventListener("click", () => {
          startBtn.disabled = false;
          stopBtn.disabled = true;
          resetBtn.disabled = false;

          clearInterval(timeId);
          timeId = null;
        });

        resetBtn.addEventListener("click", () => {
          clearInterval(timeId);
          timeId = null;
          currentTime = 0;
          updateTimer();
          initialize();
        });
      });

      // 초기 상태 설정
      initialize();
    </script>
  </body>
</html>
