      <!-- TODO List -->
      <div class="flow-root">
        <dl
          id="todo-list"
          class="my-3 divide-y divide-gray-200 rounded border-gray-200 text-sm *:even:bg-gray-50"
        ></dl>
      </div>
    </div>
    <script>
      /**
       * 1. 버튼이 클릭되면
       * 2. 인풋 값을 읽어와서 ui 요소에 li 추가
       * 3. 완료 토글 표시
       * 4. 삭제 기능 추가
       * 5. 필터링 기능 추가
       * */

      const input = document.getElementById("todo-input");
      const addButton = document.getElementById("add-button");
      const todoList = document.getElementById("todo-list");
      const todoItems = todoList.getElementsByTagName("div");
      const deleteBtns = todoList.getElementsByClassName("delete-button");

      function createTodoItem(text) {
        const id = `todo-${Date.now()}`;
        const container = document.createElement("div");
        container.className = "flex items-center gap-1 p-3";
        const content = `
            <dt class="font-medium text-gray-700 flex gap-1 items-center w-full">
              <input type="checkbox" id="${id}" />
              <label for="${id}" class="block cursor-pointer text-gray-900 w-full py-2">${text}</label>
            </dt>
            <dd>
              <button type="button" class="text-red-500 rounded-sm p-1 cursor-pointer hover:bg-gray-100 transition-colors delete-button">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                  <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
                </svg>
              </button>
            </dd>
        `;

        container.innerHTML = content;
        todoList.appendChild(container);
      }

      addButton.addEventListener("click", () => {
        const value = input.value.trim();
        if (!value) return;

        // TODO 아이템 생성
        createTodoItem(value);

        if (todoItems.length > 0) {
          todoList.classList.add("border");
        } else {
          todoList.classList.remove("border");
        }

        input.value = "";
      });

      input.addEventListener("keypress", (e) => {
        if (e.key === "Enter") {
          addButton.click();
        }
      });

      document.addEventListener("change", (e) => {
        if (e.target.matches('input[type="checkbox"]')) {
          const checkbox = e.target;
          const label = checkbox.nextElementSibling;
          if (checkbox.checked) {
            label.classList.add("line-through", "text-gray-400");
            label.classList.remove("text-gray-900");
          } else {
            label.classList.add("text-gray-900");
            label.classList.remove("line-through", "text-gray-400");
          }
        }
      });

      document.addEventListener("click", (e) => {
        if (e.target.closest(".delete-button")) {
          const button = e.target.closest(".delete-button");
          const item = button.closest("div");
          item.remove();

          if (todoItems.length > 0) {
            todoList.classList.add("border");
          } else {
            todoList.classList.remove("border");
          }
        }
      });
    </script>
