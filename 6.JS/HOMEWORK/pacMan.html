<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PacMan 게임</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="css/pacMan.css" />
  </head>
  <body class="min-h-screen bg-black px-6 py-10 text-white">
    <main class="mx-auto flex w-full max-w-4xl flex-col items-center gap-6">
      <header class="text-center">
        <h1 class="text-4xl font-black tracking-[0.45em] text-yellow-300">
          PACMAN
        </h1>
        <p class="mt-3 text-sm tracking-[0.3em] text-blue-300">
          ARROW KEYS TO MOVE
        </p>
      </header>

      <section
        class="w-full max-w-3xl rounded-3xl border border-blue-500/40 bg-slate-950/80 p-5 shadow-[0_0_40px_rgba(59,130,246,0.18)]"
      >
        <div class="mb-4 flex items-center justify-between gap-4">
          <p class="text-lg font-bold tracking-[0.2em] text-slate-100">
            SCORE <span id="score" class="ml-2 text-yellow-300">0</span>
          </p>
          <button
            id="restartBtn"
            class="rounded-full border border-yellow-300 px-4 py-2 text-sm font-bold text-yellow-300 transition hover:bg-yellow-300 hover:text-black"
          >
            RESTART
          </button>
        </div>

        <div class="flex justify-center">
          <canvas id="gameCanvas" tabindex="0"></canvas>
        </div>

        <div
          id="message"
          class="mt-4 hidden text-center text-xl font-black tracking-[0.2em] text-yellow-200"
        ></div>
      </section>
    </main>
    <script src="js/pacMan.js"></script>
  </body>
</html>
