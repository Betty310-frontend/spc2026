<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product 페이지</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <div><a href="/">뒤로 가기</a></div>
    <h1 class="text-3xl font-bold my-3">Product 페이지</h1>

    <form id="product-search-form">
      <input
        id="product-keyword"
        type="text"
        name="id"
        placeholder="상품 정보 입력"
        class="border rounded px-2 py-1"
      />
      <button
        type="submit"
        class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600"
      >
        조회
      </button>
    </form>

    <p id="product-id-display" class="text-gray-500 hidden"></p>
    <p id="product-name-display" class="text-gray-500 hidden"></p>

    <div class="overflow-x-auto">
      <table class="min-w-full divide-y-2 divide-gray-200">
        <thead class="ltr:text-left rtl:text-right">
          <tr class="*:font-medium *:text-gray-900">
            <th class="px-3 py-2 whitespace-nowrap">ID</th>
            <th class="px-3 py-2 whitespace-nowrap">Name</th>
            <th class="px-3 py-2 whitespace-nowrap">Price</th>
          </tr>
        </thead>
        <tbody
          id="product-table-body"
          class="divide-y divide-gray-200 *:even:bg-gray-50"
        ></tbody>
      </table>
    </div>
    <script>
      const params = new URLSearchParams(window.location.search);
      const productId = params.get("id");
      const productName = params.get("name");

      // 입력창에 현재 검색어 미리 채움
      if (productId) {
        document.getElementById("product-keyword").value = productId;
        const display = document.getElementById("product-id-display");
        display.textContent = `상품 ID: ${productId}`;
        display.classList.remove("hidden");
      } else if (productName) {
        document.getElementById("product-keyword").value = productName;
        const display = document.getElementById("product-name-display");
        display.textContent = `상품 이름: ${productName}`;
        display.classList.remove("hidden");
      }

      // API 호출 후 테이블 렌더링
      async function loadProducts() {
        let url = "/api/products";

        if (productId) url += `?id=${productId}`;
        else if (productName) url += `?name=${productName}`;

        const tbody = document.getElementById("product-table-body");

        try {
          const res = await fetch(url);
          const data = await res.json();

          const noProductMessage = `<tr><td colspan="3" class="px-3 py-2 text-center text-gray-500">해당 상품이 없습니다.</td></tr>`;

          if (!res.ok) {
            tbody.innerHTML = noProductMessage;
            return;
          }

          const products = Array.isArray(data.result)
            ? data.result
            : [data.result];

          if (products.length === 0) {
            tbody.innerHTML = noProductMessage;
            return;
          }

          tbody.innerHTML = products
            .map(
              (product) => `
            <tr class="*:text-gray-900 *:first:font-medium">
              <td class="px-3 py-2 whitespace-nowrap">
                <a href="/products?id=${product.id}" class="block">${product.id}</a>
              </td>
              <td class="px-3 py-2 whitespace-nowrap">
                <a href="/products?name=${product.name}" class="block">${product.name}</a>
              </td>
              <td class="px-3 py-2 whitespace-nowrap">
                ${product.price.toLocaleString()}
              </td>
            </tr>
          `,
            )
            .join("");
        } catch (error) {
          console.error("Error fetching products:", error);
        }
      }

      loadProducts();

      document
        .getElementById("product-search-form")
        .addEventListener("submit", function (event) {
          event.preventDefault();

          const keyword = document
            .getElementById("product-keyword")
            .value.trim();

          if (keyword) {
            window.location.href = isNaN(keyword)
              ? `/products?name=${keyword}`
              : `/products?id=${keyword}`;
          } else {
            window.location.href = "/products";
          }
        });
    </script>
  </body>
</html>
