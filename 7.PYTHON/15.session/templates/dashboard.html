<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <div class="container mx-auto p-4">
      <h1 class="text-2xl font-bold mb-4">Welcome, {{ user.name }}!</h1>

      <p class="text-lg mb-4">This is your dashboard.</p>

      <div class="flex gap-2">
        <a
          href="{{ url_for('profile') }}"
          class="flex-1 bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600"
          >Profile</a
        >
        <a
          href="{{ url_for('logout') }}"
          class="flex-1 bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600"
        >
          Logout
        </a>
      </div>
    </div>
    <script></script>
  </body>
</html>
