<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <div class="container mx-auto p-4">
      <h1 class="text-2xl font-bold mb-4">Profile of {{ user.name }}</h1>

      <p class="text-lg mb-4">ID: {{ user.id }}</p>
      <p class="text-lg mb-4">Name: {{ user.name }}</p>
      <p class="text-lg mb-4">Password: {{ user.password }}</p>

      {% if message %}
      <p class="text-lg mb-4 text-green-500">{{ message }}</p>
      {% endif %}

      <form method="POST">
        <label for="new_pw">New Password: </label>
        <input
          type="password"
          id="new_pw"
          name="new_pw"
          required
          class="border border-gray-300 p-2 rounded mb-4"
          required
        />
        <button type="submit" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
          비밀번호 변경
        </button>
      </form>

      <a
        href="{{ url_for('home') }}"
        class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600"
        >Back to Dashboard</a
      >
      <a
        href="{{ url_for('logout') }}"
        class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600"
        >Logout</a
      >
    </div>
    <script></script>
  </body>
</html>
