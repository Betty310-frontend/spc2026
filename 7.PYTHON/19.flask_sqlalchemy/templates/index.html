{% extends "base.html" %}

{% block title %}Home{% endblock %}

{% block content %}
    <!-- 유저 추가 폼 -->
     <div class="p-4">
        <h2 class="text-2xl font-bold my-2">유저 추가</h2>
        <form action="/add-user" method="POST">
            <div class="mb-4 flex items-center">
                <label for="username" class="w-24">Username:</label>
                <input type="text" id="username" name="username" placeholder="이름" class="p-2 border border-gray-300 rounded" />
            </div>
            <div class="mb-4 flex items-center">
                <label for="age" class="w-24">Age:</label>
                <input type="number" id="age" name="age" placeholder="나이" min="0" max="120" class="p-2 border border-gray-300 rounded" />
            </div>
            <button type="submit" class="p-2 bg-blue-500 text-white rounded">Add User</button>
        </form>
     </div>

    <ul>
        {% for user in users %}
            <li>
                {{user.id}} - {{ user.name }}, {{ user.age }}
                <form action="{{ url_for('delete_user', user_id=user.id) }}" method="POST" style="display:inline;">
                    <button type="submit" class="p-1.5 bg-red-500 text-white text-sm rounded cursor-pointer">삭제</button>
                </form>
            </li>
        {% endfor %}
    </ul>
{% endblock %}
