<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>마이 타이틀</title>
  </head>
  <body>
    <h1>사용자 명단</h1>
    <ul>
      {% for user in users %}
      <li>사용자 이름: {{ user['name'] }}</li>
      <ul>
        <li>나이: {{ user['age'] }}</li>
        <li>전화번호: {{ user['phone'] }}</li>
      </ul>
      {% endfor %}
    </ul>
  </body>
</html>
