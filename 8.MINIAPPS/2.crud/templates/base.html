<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <header class="bg-white shadow">
      <div class="mx-auto flex h-16 max-w-7xl justify-between items-center gap-8 px-4 sm:px-6 lg:px-8">
        <a href="{{url_for('home')}}" class="font-bold">Home</a>
        <nav class="flex items-center gap-4">
          {% if 'user' in session %}
          <a href="{{url_for('logout')}}" class="block rounded-md bg-teal-600 px-5 py-2.5 text-sm font-medium text-white transition hover:bg-teal-700">Logout</a>
          <a href="{{url_for('profile')}}" class="rounded-md bg-gray-100 px-5 py-2.5 text-sm font-medium text-teal-600 transition hover:text-teal-600/75 sm:block">Profile</a>
          {% else %}
          <a href="{{url_for('login')}}" class="block rounded-md bg-teal-600 px-5 py-2.5 text-sm font-medium text-white transition hover:bg-teal-700">Login</a>
          {% endif %}
        </nav>
      </div>
    </header>
    <div class="p-4">{% block content %} {% endblock %}</div>
    <script></script>
  </body>
</html>
